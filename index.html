    <script>
      // Make window.fetch writable to prevent extension setter TypeError crashes
      try {
        if (window.fetch) {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            value: originalFetch,
            writable: true,
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        // Safe fallback
      }

      // Catch and completely silence third-party/chrome-extension exceptions in the browser
      window.addEventListener('error', function(event) {
        if (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('libs/requests.js') !== -1)) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    </script>
